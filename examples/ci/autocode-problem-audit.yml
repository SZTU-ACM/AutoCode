# SECURITY BOUNDARY (untrusted PR C++ compilation & execution):
# - Run untrusted PR audits ONLY on ephemeral GitHub-hosted runners (e.g. ubuntu-latest).
# - NEVER run on privileged or persistent self-hosted runners.
# - NEVER inject sensitive secrets or elevated GITHUB_TOKEN permissions.
# - NEVER switch `pull_request` to `pull_request_target` (which runs PR code with base secrets/write context).
name: AutoCode Problem CI Audit

on:
  push:
    branches: [main, master]
  pull_request:  # SECURITY: NEVER switch to pull_request_target for untrusted PRs.
  workflow_dispatch:

permissions:
  contents: read  # SECURITY: keep least-privilege read-only token; NEVER inject secrets.

env:
  AUTOCODE_REF: v3.3.0
  PROBLEM_DIR: .

jobs:
  audit:
    name: Standalone Problem Audit
    runs-on: ubuntu-latest  # SECURITY: ephemeral GitHub-hosted runners ONLY; NEVER self-hosted.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Verify C++ toolchain and install autocode-audit
        run: |
          g++ --version
          uv tool install "git+https://github.com/SZTU-ACM/AutoCode.git@${AUTOCODE_REF}"

      - name: Run zero-write standalone audit
        run: |
          set +e
          # `--sandbox auto` probes Linux sandboxes (bwrap/nsjail/isolate) when available
          # and gracefully falls back to `none`. For strict sandbox isolation on ubuntu-latest,
          # install `bubblewrap` (e.g. `sudo apt-get install -y bubblewrap`) and pass `--sandbox bwrap`.
          "$HOME/.local/bin/autocode-audit" "$PROBLEM_DIR" \
            --standalone \
            --layout auto \
            --sandbox auto \
            --mutation-check \
            --format markdown \
            --report "$(pwd)/audit_report.json" > audit_report.md
          rc=$?
          cat audit_report.md
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat audit_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: Upload audit report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autocode-audit-report
          path: |
            audit_report.json
            audit_report.md
          if-no-files-found: ignore

      # Optional PR failure comment (disabled by default):
      # Only enable `vars.AUTOCODE_PR_COMMENT == 'true'` on trusted setups with
      # `pull-requests: write`; keep `on: pull_request` (NEVER `pull_request_target`)
      # and never expose sensitive secrets to untrusted fork PRs.
      - name: Post audit report PR comment on failure (opt-in)
        if: ${{ failure() && github.event_name == 'pull_request' && vars.AUTOCODE_PR_COMMENT == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            if (!fs.existsSync("audit_report.md")) return;
            const raw = fs.readFileSync("audit_report.md", "utf8");
            const body = raw.length > 60000
              ? `${raw.slice(0, 60000)}\n\n...(truncated; see uploaded autocode-audit-report artifact)`
              : raw;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
